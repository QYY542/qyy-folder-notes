name: Build and release

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.0'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test
        run: |
          npm run build
          npm test
          node scripts/verify-build-1114-1738.cjs
          git diff --exit-code -- main.js manifest.json styles.css versions.json README.md PRIVACY.md RELEASE-CHECKLIST.md package-lock.json

  release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.0'
      - name: Rebuild exact tagged sources
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node scripts/verify-build-1114-1738.cjs
          git diff --exit-code -- main.js manifest.json styles.css versions.json README.md PRIVACY.md RELEASE-CHECKLIST.md package-lock.json
      - name: Attest installation artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
      - name: Publish formal release after attestation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" main.js manifest.json styles.css \
            --verify-tag --title "QYY Folder Notes $RELEASE_TAG" \
            --notes-file docs/release-notes-1115-0010.md --latest
